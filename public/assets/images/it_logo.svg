<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="it-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#it-grad)"/>
  
  <!-- Tech Nodes & Circuit Symbol -->
  <polygon points="100,52 135,72 135,112 100,132 65,112 65,72" fill="none" stroke="url(#cyan-grad)" stroke-width="4"/>
  <circle cx="100" cy="52" r="5" fill="#67E8F9"/>
  <circle cx="135" cy="72" r="5" fill="#67E8F9"/>
  <circle cx="135" cy="112" r="5" fill="#67E8F9"/>
  <circle cx="100" cy="132" r="5" fill="#67E8F9"/>
  <circle cx="65" cy="112" r="5" fill="#67E8F9"/>
  <circle cx="65" cy="72" r="5" fill="#67E8F9"/>
  <circle cx="100" cy="92" r="10" fill="#67E8F9"/>

  <!-- Lines connecting center -->
  <line x1="100" y1="92" x2="100" y2="52" stroke="#67E8F9" stroke-width="2.5"/>
  <line x1="100" y1="92" x2="135" y2="112" stroke="#67E8F9" stroke-width="2.5"/>
  <line x1="100" y1="92" x2="65" y2="112" stroke="#67E8F9" stroke-width="2.5"/>

  <!-- Text MAHDEV IT -->
  <text x="100" y="160" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MAHDEV IT</text>
  <text x="100" y="177" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="8" fill="#A5B4FC" text-anchor="middle" letter-spacing="2.5">SOLUTIONS &amp; CLOUD</text>
</svg>
