<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="bag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#mart-grad)"/>
  
  <!-- Shopping Bag / Cart Emblem -->
  <!-- Handle -->
  <path d="M82 78 C82 62, 118 62, 118 78" fill="none" stroke="#FED7AA" stroke-width="5" stroke-linecap="round"/>
  <!-- Bag Body -->
  <path d="M68 76 L132 76 L124 125 L76 125 Z" fill="url(#bag-grad)"/>
  <!-- Diamond / Sparkle on bag -->
  <polygon points="100,88 106,99 117,100 108,107 111,118 100,111 89,118 92,107 83,100 94,99" fill="#FFFFFF"/>

  <!-- Text MAHDEV MART -->
  <text x="100" y="156" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MART</text>
  <text x="100" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#FED7AA" text-anchor="middle" letter-spacing="2.5">PREMIUM COMMERCE</text>
</svg>
